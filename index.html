<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chessium</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0a0c' stroke='%239b2020' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23c83838'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="chessium">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a0c'/%3E%3Ccircle cx='90' cy='90' r='66' fill='none' stroke='%239b2020' stroke-width='10'/%3E%3Ccircle cx='90' cy='90' r='22' fill='%23c83838'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --bg-2: #131318;
      --bg-3: #18181f;
      --fg: #e8e8ec;
      --fg-dim: #6b6b75;
      --fg-dimmer: #3a3a42;
      --accent: #9b2020;
      --accent-bright: #c83838;
      --accent-glow: rgba(155, 32, 32, 0.4);
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(200, 56, 56, 0.5);
      --danger: #d04040;
      --success: #4caf50;
      --warning: #f0b040;
      --mono: 'Space Mono', 'Consolas', monospace;
      --display: 'Fraunces', Georgia, serif;
      --bg-image: none;
      --bg-blur: 0px;
      --bg-dim: 0;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
    }
    body { overflow-x: hidden; position: relative; }

    /* Custom background image layer */
    .bg-layer {
      position: fixed; inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      filter: blur(var(--bg-blur));
      transform: scale(1.05); /* hide blur edges */
    }
    .bg-layer-dim {
      position: fixed; inset: 0;
      z-index: 0;
      pointer-events: none;
      background: rgba(10, 10, 12, var(--bg-dim));
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, var(--accent-glow), transparent 50%),
        radial-gradient(ellipse at 80% 100%, var(--accent-glow), transparent 50%);
      opacity: 0.5; pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes blink {
      0%, 50%, 100% { opacity: 0.25; }
      25%, 75% { opacity: 0.7; }
    }

    /* ─── MAIN ─── */
    .main {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      padding: 2.5rem 3.5rem;
      animation: fadeIn 0.4s ease;
    }
    .main.idle { opacity: 0.55; transition: opacity 0.8s ease; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.65rem; color: var(--fg-dim);
      letter-spacing: 0.3em; text-transform: uppercase;
    }
    .topbar-left, .topbar-right { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .status-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--accent);
      margin-right: 0.5rem;
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse 2s ease infinite;
    }
    .topbar .weather { display: flex; gap: 0.5rem; align-items: center; }
    .topbar .weather-temp { color: var(--fg); font-weight: 700; }
    .topbar .ipbox {
      display: flex; gap: 0.5rem; align-items: center;
      cursor: pointer;
      padding: 0.2rem 0.5rem; margin: -0.2rem -0.5rem;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .topbar .ipbox:hover { background: var(--bg-2); color: var(--fg); }
    .topbar .ipbox.copied { color: var(--accent-bright); }
    .topbar .ip-value { color: var(--fg); font-weight: 700; letter-spacing: 0.05em; }
    .topbar .ip-country { color: var(--fg-dim); font-weight: 400; margin-left: 0.3rem; }
    .topbar .ipbox svg { width: 12px; height: 12px; }

    /* ─── CLOCK + DEADLINE ─── */
    .clock-row {
      display: flex; align-items: center; justify-content: center;
      gap: 1.8rem;
      padding: 3rem 0 0.6rem;
    }
    .clock-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.8rem;
    }
    .clock {
      font-family: var(--display); font-weight: 200;
      font-size: 9rem; letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
      display: flex; align-items: baseline; gap: 0.05em;
    }
    .clock .sep { opacity: 0.25; animation: blink 1s ease infinite; }
    .clock .seconds {
      font-family: var(--mono); font-size: 0.22em;
      color: var(--accent-bright);
      margin-left: 0.5em; align-self: flex-end;
      padding-bottom: 1.2em; font-weight: 400; letter-spacing: 0;
    }
    .clock .seconds.hidden { display: none; }
    .date {
      font-size: 0.75rem; color: var(--fg-dim);
      letter-spacing: 0.35em; text-transform: uppercase;
    }
    .tz-label {
      font-size: 0.6rem; color: var(--fg-dimmer);
      letter-spacing: 0.5em;
    }

    /* Deadline badge — variant B */
    .deadline-card {
      min-width: 200px; max-width: 240px;
      padding: 0.9rem 1.1rem;
      background: rgba(155, 32, 32, 0.06);
      border-left: 2px solid var(--accent-bright);
      cursor: pointer;
      animation: deadlineSlide 0.4s ease;
      transition: background 0.2s, border-color 0.2s;
    }
    .deadline-card:hover {
      background: rgba(155, 32, 32, 0.12);
    }
    .deadline-card.overdue {
      border-left-color: var(--danger);
      background: rgba(208, 64, 64, 0.08);
    }
    .deadline-card.pulse {
      animation: deadlineSlide 0.4s ease, deadlinePulse 2s ease infinite;
    }
    .deadline-card.overdue.pulse {
      animation: deadlineSlide 0.4s ease, deadlinePulseOverdue 1.2s ease infinite;
    }
    .deadline-label {
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 0.45rem;
    }
    .deadline-card.overdue .deadline-label { color: var(--danger); }
    .deadline-text {
      font-size: 0.85rem;
      color: var(--fg);
      line-height: 1.35;
      margin-bottom: 0.4rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .deadline-time {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--fg-dim);
      letter-spacing: 0.12em;
    }
    @keyframes deadlinePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(200, 56, 56, 0.2); }
      50%      { box-shadow: 0 0 0 6px rgba(200, 56, 56, 0); }
    }
    @keyframes deadlinePulseOverdue {
      0%, 100% { box-shadow: 0 0 0 0 rgba(208, 64, 64, 0.35); }
      50%      { box-shadow: 0 0 0 8px rgba(208, 64, 64, 0); }
    }
    @keyframes deadlineSlide {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ─── WORKSPACE TABS ─── */
    .ws-tabs {
      display: flex; justify-content: center;
      gap: 2rem;
      margin: 0 auto 2rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      flex-wrap: wrap;
      align-items: center;
    }
    .ws-tab {
      background: none; border: none;
      color: var(--fg-dim);
      cursor: pointer;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      padding: 0.4rem 0;
      position: relative;
      transition: color 0.15s;
      user-select: none;
    }
    .ws-tab:hover { color: var(--fg); }
    .ws-tab.active { color: var(--fg); }
    .ws-tab.active::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .ws-tab.dragging { opacity: 0.4; }
    .ws-tab.drag-over { color: var(--accent-bright); }
    .ws-tab-count {
      opacity: 0.5;
      font-size: 0.85em;
      margin-left: 0.4em;
    }
    .ws-add {
      background: none; border: none;
      color: var(--fg-dim);
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      display: flex; align-items: center;
      transition: color 0.15s;
    }
    .ws-add:hover { color: var(--accent-bright); }
    .ws-add svg { width: 12px; height: 12px; }
    .breadcrumb {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem;
      margin: 0 auto 2rem;
      color: var(--fg-dim);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      background: none; border: none;
      font-family: var(--mono);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .breadcrumb:hover { color: var(--fg); }
    .breadcrumb.drag-over { color: var(--accent-bright); border-color: var(--accent-bright); }
    .breadcrumb svg { width: 12px; height: 12px; }

    /* ─── GRID WRAPPER ─── */
    .grid-wrap { max-width: 1400px; width: 100%; margin: 0 auto; }

    /* ─── VIEW MODES ─── */

    /* default: grid */
    .grid.view-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols, 4), 1fr);
      gap: 0.75rem;
    }

    /* compact: smaller tiles, more columns */
    .grid.view-compact {
      display: grid;
      grid-template-columns: repeat(calc(var(--cols, 4) + 2), 1fr);
      gap: 0.5rem;
    }
    .grid.view-compact .tile {
      padding: 0.7rem 0.8rem;
      min-height: auto;
      gap: 0.3rem;
    }
    .grid.view-compact .tile-name { font-size: 0.85rem; }
    .grid.view-compact .tile-host { font-size: 0.6rem; }
    .grid.view-compact .tile-label { display: none; }
    .grid.view-compact .tile-icon { width: 18px; height: 18px; }

    /* list: one column rows */
    .grid.view-list {
      display: flex; flex-direction: column;
      gap: 0.4rem;
    }
    .grid.view-list .tile {
      padding: 0.6rem 1.1rem;
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 1rem;
      min-height: 0;
    }
    .grid.view-list .tile-head { display: contents; }
    .grid.view-list .tile-icon { width: 18px; height: 18px; margin-right: 0; }
    .grid.view-list .tile-label {
      grid-column: 4;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
    }
    .grid.view-list .tile-name {
      font-size: 0.95rem;
      font-family: var(--mono);
      font-weight: 400;
    }
    .grid.view-list .tile-host { font-size: 0.65rem; }
    .grid.view-list .tile-actions {
      position: static; opacity: 0;
      grid-column: 5;
    }
    .grid.view-list .tile:hover .tile-actions { opacity: 1; }

    /* quickdial: large circular tiles */
    .grid.view-quickdial {
      display: grid;
      grid-template-columns: repeat(calc(var(--cols, 4) + 1), 1fr);
      gap: 1.4rem 0.5rem;
      justify-items: center;
      padding: 0.5rem 0;
    }
    .grid.view-quickdial .tile {
      padding: 0;
      background: transparent;
      border: none;
      width: 110px;
      max-width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      overflow: visible;
      contain: none;
      transform: none !important;
    }
    .grid.view-quickdial .tile::before { display: none; }
    .grid.view-quickdial .tile-head {
      width: 72px; height: 72px;
      flex-shrink: 0;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      gap: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .grid.view-quickdial .tile-head .tile-icon { margin: 0; }
    .grid.view-quickdial .tile:hover { transform: none; }
    .grid.view-quickdial .tile:hover .tile-head {
      border-color: var(--border-hover);
      background: var(--bg-3);
    }
    .grid.view-quickdial .tile-icon { width: 28px; height: 28px; }
    .grid.view-quickdial .tile-label { display: none; }
    .grid.view-quickdial .tile-name {
      font-family: var(--mono);
      font-size: 0.7rem;
      text-align: center;
      letter-spacing: 0.05em;
      max-width: 100px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .grid.view-quickdial .tile-host { display: none; }
    .grid.view-quickdial .tile-hotkey { display: none; }
    .grid.view-quickdial .tile-actions {
      top: 0; right: 50%;
      bottom: auto;
      transform: translateX(50%);
    }

    /* terminal: textual list */
    .grid.view-terminal {
      display: flex; flex-direction: column;
      gap: 0;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem 1.2rem;
      font-family: var(--mono);
      font-size: 0.78rem;
    }
    .grid.view-terminal .tile {
      padding: 0.3rem 0;
      background: transparent;
      border: none;
      border-radius: 0;
      display: grid;
      grid-template-columns: 32px 1fr 2fr auto;
      align-items: center;
      gap: 0.8rem;
      min-height: 0;
    }
    .grid.view-terminal .tile::before { display: none; }
    .grid.view-terminal .tile:hover { background: var(--bg-2); transform: none; }
    .grid.view-terminal .tile-head { display: contents; }
    .grid.view-terminal .tile-icon {
      width: 14px; height: 14px;
      grid-column: 1;
      color: var(--fg-dim);
    }
    .grid.view-terminal .tile:hover .tile-icon { color: var(--accent-bright); }
    .grid.view-terminal .tile-label {
      grid-column: 1; /* hide via index */
      display: none;
    }
    .grid.view-terminal .tile-name {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 400;
      grid-column: 2;
    }
    .grid.view-terminal .tile-host {
      grid-column: 3;
      color: var(--fg-dim);
      font-size: 0.72rem;
    }
    .grid.view-terminal .tile-actions {
      grid-column: 4;
      position: static;
      opacity: 0;
    }
    .grid.view-terminal .tile:hover .tile-actions { opacity: 1; }

    /* ─── TILE BASE ─── */
    .tile {
      position: relative;
      padding: 1.1rem 1.3rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--fg);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      overflow: hidden;
      display: flex; flex-direction: column; gap: 0.6rem;
      cursor: pointer;
      contain: layout style;
      user-select: none;
    }
    .tile::before {
      content: '';
      position: absolute; left: 0; top: 1px; bottom: 1px;
      width: 3px;
      background: var(--tile-color, var(--accent));
      border-radius: 8px 0 0 8px;
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.25s ease;
      pointer-events: none;
    }
    .tile:hover {
      border-color: var(--tile-color, var(--border-hover));
      background: var(--bg-3);
      transform: translateY(-2px);
    }
    .tile:hover::before { transform: scaleY(1); transform-origin: top; }
    .tile.dragging { opacity: 0.4; }
    .tile.drag-over { border-color: var(--accent-bright); }
    .tile.has-color::before { background: var(--tile-color); }

    .tile-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 0.5rem;
    }
    .tile-icon {
      width: 22px; height: 22px;
      color: var(--fg-dim);
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .tile:hover .tile-icon { color: var(--tile-color, var(--accent-bright)); }
    .tile-favicon {
      width: 20px; height: 20px;
      border-radius: 4px;
      object-fit: contain;
    }
    .tile-favicon.favicon-failed { visibility: hidden; }
    .grid.view-quickdial .tile-favicon { width: 26px; height: 26px; }
    .tile-label {
      font-size: 0.6rem; letter-spacing: 0.35em;
      color: var(--fg-dim); text-transform: uppercase;
      transition: color 0.2s;
    }
    .tile:hover .tile-label { color: var(--tile-color, var(--accent-bright)); }
    .tile-name {
      font-family: var(--display);
      font-size: 1.15rem; font-weight: 400;
      letter-spacing: -0.01em; color: var(--fg);
    }
    .tile-host {
      font-size: 0.65rem; color: var(--fg-dim);
      font-family: var(--mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tile-hotkey {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--fg-dimmer);
      letter-spacing: 0.1em;
      padding: 0.1em 0.4em;
      border: 1px solid var(--border);
      border-radius: 3px;
      pointer-events: none;
      opacity: 0.7;
    }

    .tile-actions {
      position: absolute; bottom: 0.5rem; right: 0.5rem;
      display: flex; gap: 0.25rem;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }
    .tile:hover .tile-actions { opacity: 1; }
    .tile-act {
      background: rgba(0,0,0,0.55);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--fg-dim);
      transition: color 0.15s, border-color 0.15s;
      backdrop-filter: blur(4px);
    }
    .tile-act:hover { color: var(--fg); border-color: var(--border-strong); }
    .tile-act.danger:hover { color: var(--danger); border-color: var(--danger); }
    .tile-act svg { width: 11px; height: 11px; }

    .tile-tool .tile-label { color: var(--accent); opacity: 0.75; }
    .tile-tool .tile-icon { color: var(--accent); opacity: 0.85; }
    .tile-tool:hover .tile-label { color: var(--accent-bright); opacity: 1; }
    .tile-tool .tile-host { font-style: italic; opacity: 0.6; }

    .tile-folder .tile-icon { color: var(--accent); opacity: 0.9; }
    .tile-folder .tile-host { color: var(--accent); opacity: 0.7; }

    .tile-curr .curr-pair-name { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--fg-dim); }
    .tile-curr .curr-big {
      font-family: var(--display);
      font-size: 1.6rem;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .tile-curr .curr-delta {
      font-size: 0.7rem;
      font-family: var(--mono);
      display: flex; gap: 0.3rem; align-items: center;
    }
    .tile-curr .curr-delta.up { color: var(--success); }
    .tile-curr .curr-delta.down { color: var(--danger); }
    .tile-curr .curr-delta.flat { color: var(--fg-dim); }
    .tile-curr .curr-delta svg { width: 12px; height: 12px; }

    /* FAB — only when grid is empty */
    .fab {
      position: fixed;
      bottom: 5rem; right: 2rem;
      z-index: 180;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: var(--fg);
      cursor: pointer;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.2s;
    }
    .fab:hover { background: var(--accent-bright); transform: translateY(-2px); }
    .fab svg { width: 22px; height: 22px; }
    .fab.show { display: flex; animation: fadeIn 0.3s ease; }

    /* empty state for workspace */
    .grid-empty {
      grid-column: 1 / -1;
      padding: 4rem 1rem;
      text-align: center;
      color: var(--fg-dim);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .grid-empty .hint {
      margin-top: 1rem;
      font-size: 0.65rem;
      color: var(--fg-dimmer);
      letter-spacing: 0.2em;
    }
    .grid-empty .hint .kbd { margin: 0 0.2em; }

    /* footer */
    .footer {
      margin-top: 2rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.6rem; color: var(--fg-dim);
      letter-spacing: 0.3em; text-transform: uppercase;
      display: flex; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
      max-width: 1400px; width: 100%; margin-left: auto; margin-right: auto;
    }
    .footer-btns { display: flex; gap: 1.5rem; align-items: center; }
    .footer button {
      background: none; border: none;
      color: var(--fg-dim);
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      cursor: pointer; transition: color 0.2s;
    }
    .footer button:hover { color: var(--accent-bright); }
    .footer .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px;
      padding: 0;
    }
    .footer .icon-btn svg { width: 14px; height: 14px; }
    .kbd {
      display: inline-block; padding: 0.1em 0.4em;
      border: 1px solid var(--border-strong);
      border-radius: 3px; background: var(--bg-2);
      font-size: 0.9em; letter-spacing: 0.1em;
      color: var(--fg);
    }
    .sync-indicator {
      display: inline-flex; align-items: center; gap: 0.3rem;
      margin-left: 0.4rem;
      font-size: 0.55rem;
      color: var(--fg-dimmer);
    }
    .sync-indicator.syncing { color: var(--warning); }
    .sync-indicator.ok { color: var(--success); }
    .sync-indicator.error { color: var(--danger); }

    /* ─── MODAL ─── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 500;
      display: none;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.active { display: flex; }
    .modal {
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 2rem;
      width: 90%; max-width: 560px;
      max-height: 85vh; overflow-y: auto;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      font-family: var(--display); font-weight: 300;
      font-size: 1.4rem; margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }
    .modal h3 {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin: 1.5rem 0 0.8rem;
    }
    .field { margin-bottom: 1.2rem; }
    .field label {
      display: block;
      font-size: 0.6rem; letter-spacing: 0.3em;
      color: var(--fg-dim); text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.7rem 0.9rem;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.85rem;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .field textarea { resize: vertical; min-height: 120px; }

    .icon-grid {
      display: grid; grid-template-columns: repeat(10, 1fr);
      gap: 0.4rem; max-height: 280px; overflow-y: auto;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
    }
    .icon-grid::-webkit-scrollbar { width: 6px; }
    .icon-grid::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    .icon-opt {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      color: var(--fg-dim);
      transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .icon-opt:hover { color: var(--fg); background: var(--bg-3); }
    .icon-opt.selected {
      color: var(--accent-bright);
      border-color: var(--accent);
      background: rgba(155, 32, 32, 0.08);
    }
    .icon-opt svg { width: 16px; height: 16px; }

    .color-palette {
      display: flex; gap: 0.4rem; flex-wrap: wrap;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
    }
    .color-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.selected { border-color: var(--fg); }
    .color-dot.color-none {
      background: transparent;
      border: 1px dashed var(--fg-dim);
    }
    .color-dot.color-custom {
      display: flex; align-items: center; justify-content: center;
      color: var(--fg-dim);
      border: 1px dashed var(--fg-dim);
      overflow: hidden;
      position: relative;
    }
    .color-dot.color-custom svg { width: 14px; height: 14px; }
    .color-dot.color-custom.selected svg { display: none; }
    .color-dot.color-custom input[type="color"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
      padding: 0; border: none;
    }

    .modal-actions {
      display: flex; gap: 0.6rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.7rem 1.4rem;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--fg);
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--fg-dim); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: rgba(208, 64, 64, 0.1); border-color: var(--danger); }
    .btn-small { padding: 0.4rem 0.8rem; font-size: 0.65rem; }
    .btn-ghost { border-color: transparent; color: var(--fg-dim); }
    .btn-ghost:hover { color: var(--fg); border-color: var(--border-strong); }

    .type-selector { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; }
    .type-opt {
      flex: 1;
      padding: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--fg-dim);
      cursor: pointer;
      text-align: center;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .type-opt:hover { color: var(--fg); }
    .type-opt.active {
      color: var(--fg);
      border-color: var(--accent);
      background: rgba(155, 32, 32, 0.06);
    }

    /* ─── CONTEXT MENU ─── */
    .ctx-menu {
      position: fixed;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0.4rem;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      z-index: 600;
      display: none;
      min-width: 220px;
      animation: modalIn 0.12s ease;
    }
    .ctx-menu.active { display: block; }
    .ctx-item {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.55rem 0.8rem;
      cursor: pointer;
      border-radius: 5px;
      color: var(--fg);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: var(--bg-3); }
    .ctx-item.danger:hover { background: rgba(208, 64, 64, 0.15); color: var(--danger); }
    .ctx-item svg { width: 14px; height: 14px; color: var(--fg-dim); flex-shrink: 0; }
    .ctx-item:hover svg { color: var(--accent-bright); }
    .ctx-item.danger:hover svg { color: var(--danger); }
    .ctx-item-with-sub { position: relative; }
    .ctx-item-with-sub::after {
      content: '›';
      margin-left: auto;
      color: var(--fg-dim);
    }
    .ctx-sub {
      display: none;
      position: absolute;
      left: 100%; top: -0.4rem;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 0.4rem;
      min-width: 180px;
    }
    .ctx-item-with-sub:hover .ctx-sub { display: block; }
    .ctx-sep {
      height: 1px;
      background: var(--border);
      margin: 0.3rem 0.4rem;
    }
    .ctx-label {
      padding: 0.4rem 0.8rem;
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: var(--fg-dimmer);
      text-transform: uppercase;
    }

    /* ─── COMMAND PALETTE ─── */
    .cmdk {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      z-index: 700;
      display: none;
      align-items: flex-start; justify-content: center;
      padding-top: 15vh;
    }
    .cmdk.active { display: flex; }
    .cmdk-box {
      width: 90%; max-width: 580px;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .cmdk input {
      width: 100%; background: transparent;
      border: none; color: var(--fg);
      padding: 1.1rem 1.3rem;
      font-family: var(--mono); font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
    }
    .cmdk input:focus { outline: none; }
    .cmdk-list { max-height: 380px; overflow-y: auto; }
    .cmdk-item {
      display: flex; align-items: center; gap: 0.9rem;
      padding: 0.7rem 1.3rem;
      cursor: pointer; color: var(--fg-dim);
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .cmdk-item.active, .cmdk-item:hover {
      background: var(--bg-3); color: var(--fg);
      border-left-color: var(--accent);
    }
    .cmdk-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .cmdk-item-text { flex: 1; overflow: hidden; }
    .cmdk-item-name { font-size: 0.85rem; }
    .cmdk-item-host { font-size: 0.65rem; color: var(--fg-dim); }
    .cmdk-item-hint {
      font-size: 0.65rem; color: var(--fg-dimmer);
      letter-spacing: 0.2em; text-transform: uppercase;
    }
    .cmdk-empty {
      padding: 1.5rem; text-align: center;
      color: var(--fg-dim); font-size: 0.8rem;
    }
    .cmdk-section {
      padding: 0.4rem 1.3rem 0.2rem;
      font-size: 0.55rem;
      letter-spacing: 0.35em;
      color: var(--fg-dimmer);
      text-transform: uppercase;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 5rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.7rem 1.4rem;
      border-radius: 6px;
      font-size: 0.75rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 800;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      max-width: 90vw;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.success { border-color: var(--success); color: var(--success); }

    /* ─── AI BAR ─── */
    .aibar {
      position: fixed;
      left: 50%; bottom: 1.2rem;
      transform: translateX(-50%);
      z-index: 200;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.6rem;
      background: rgba(19, 19, 24, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 92vw;
      transition: opacity 0.3s, transform 0.3s;
    }
    .aibar.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px); }
    .aibar-lead { width: 14px; height: 14px; color: var(--fg-dimmer); flex-shrink: 0; }
    .aibar input {
      width: 240px; max-width: 38vw;
      background: transparent; border: none; color: var(--fg);
      padding: 0.45rem 0.6rem;
      font-family: var(--mono); font-size: 0.8rem;
      flex-shrink: 0;
    }
    .aibar input:focus { outline: none; }
    .aibar input::placeholder { color: var(--fg-dim); }
    .ai-engines {
      display: flex; align-items: center; gap: 0.4rem;
      flex: 1 1 auto; min-width: 0;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 30px 0 2px;
      margin-top: -28px;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 8px, #000 calc(100% - 8px), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 8px, #000 calc(100% - 8px), transparent 100%);
    }
    .ai-engines::-webkit-scrollbar { display: none; }
    .ai-group { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
    .ai-divider { width: 1px; height: 20px; background: var(--border-strong); flex-shrink: 0; }
    .ai-btn {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0;
      flex-shrink: 0;
    }
    .ai-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .ai-btn svg { width: 16px; height: 16px; display: block; }
    .ai-btn[data-eng="claude"]  { color: #d97757; }
    .ai-btn[data-eng="gpt"]     { color: #10a37f; }
    .ai-btn[data-eng="gemini"]  { color: #4285f4; }
    .ai-btn[data-eng="deepseek"]{ color: #6671f8; }
    .ai-btn[data-eng="google"]  { color: #4285f4; }
    .ai-btn[data-eng="ddg"]     { color: #de5833; }
    .ai-btn .ai-tooltip {
      position: absolute; bottom: 100%; left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.3rem 0.6rem; border-radius: 4px;
      font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.12s;
    }
    .ai-btn:hover .ai-tooltip { opacity: 1; }
    @media (max-width: 640px) {
      .aibar { gap: 0.3rem; padding: 0.4rem 0.45rem; max-width: 96vw; }
      .aibar input { width: 96px; max-width: 32vw; padding: 0.4rem 0.35rem; }
      .aibar-lead { width: 12px; height: 12px; }
      .ai-btn { width: 30px; height: 30px; }
      .ai-btn .ai-tooltip { display: none; }
    }

    /* ─── TODO PANEL ─── */
    .todo-toggle {
      position: fixed;
      top: 50%; right: 0;
      transform: translateY(-50%);
      z-index: 150;
      width: 36px; height: 56px;
      background: var(--bg-2);
      border: 1px solid var(--border-strong);
      border-right: none;
      border-radius: 8px 0 0 8px;
      color: var(--fg-dim);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, border-color 0.15s;
      padding: 0;
    }
    .todo-toggle:hover { color: var(--accent-bright); border-color: var(--accent); }
    .todo-toggle svg { width: 16px; height: 16px; display: block; }
    .todo-toggle .badge {
      position: absolute;
      top: -6px; left: -6px;
      min-width: 18px; height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--fg);
      font-size: 0.55rem;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      letter-spacing: 0;
    }
    .todo-toggle .badge.urgent { background: var(--danger); animation: pulse 1s infinite; }
    .todo-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 380px; max-width: 90vw;
      background: var(--bg-2);
      border-left: 1px solid var(--border-strong);
      z-index: 400;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex; flex-direction: column;
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    .todo-panel.open { transform: translateX(0); }
    .todo-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .todo-header h2 {
      font-family: var(--display);
      font-weight: 300;
      font-size: 1.3rem;
    }
    .todo-close {
      background: transparent; border: 1px solid var(--border-strong);
      color: var(--fg-dim);
      width: 28px; height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .todo-close:hover { color: var(--fg); }
    .todo-close svg { width: 12px; height: 12px; }
    .todo-add {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .todo-add-row { display: flex; gap: 0.5rem; }
    .todo-add input[type=text] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    .todo-add input[type=text]:focus { outline: none; border-color: var(--accent); }
    .todo-add input[type=datetime-local] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color-scheme: dark;
    }
    .todo-add input[type=datetime-local]:focus { outline: none; border-color: var(--accent); }
    .todo-add-clear {
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--fg-dim);
      padding: 0 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.7rem;
    }
    .todo-add-clear:hover { color: var(--danger); }
    .todo-add-btn {
      padding: 0.6rem 0.9rem;
      background: var(--accent);
      border: none; color: var(--fg);
      border-radius: 6px; cursor: pointer;
      font-family: var(--mono);
    }
    .todo-list { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
    .todo-section-label {
      padding: 0.6rem 1.5rem 0.4rem;
      font-size: 0.55rem; color: var(--fg-dim);
      letter-spacing: 0.35em; text-transform: uppercase;
    }
    .todo-item {
      display: flex; align-items: flex-start;
      gap: 0.7rem;
      padding: 0.7rem 1.5rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.12s;
    }
    .todo-item:hover { background: var(--bg-3); }
    .todo-item.urgent { border-left-color: var(--warning); }
    .todo-item.overdue { border-left-color: var(--danger); }
    .todo-item.pinned { border-left-color: var(--accent); background: rgba(155, 32, 32, 0.03); }
    .todo-check {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--fg-dim);
      flex-shrink: 0;
      margin-top: 2px;
      transition: background 0.12s, border-color 0.12s;
      display: flex; align-items: center; justify-content: center;
    }
    .todo-check svg { width: 10px; height: 10px; color: var(--fg); opacity: 0; }
    .todo-item.done .todo-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .todo-item.done .todo-check svg { opacity: 1; }
    .todo-text-wrap { flex: 1; min-width: 0; }
    .todo-text {
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-word;
      display: flex; gap: 0.4rem; align-items: center;
    }
    .todo-text .pin-icon {
      width: 11px; height: 11px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .todo-item.done .todo-text {
      color: var(--fg-dim);
      text-decoration: line-through;
      text-decoration-color: var(--fg-dimmer);
    }
    .todo-deadline {
      font-size: 0.65rem;
      color: var(--fg-dim);
      margin-top: 0.3rem;
      letter-spacing: 0.08em;
      display: flex; gap: 0.3rem; align-items: center;
    }
    .todo-item.urgent .todo-deadline { color: var(--warning); }
    .todo-item.overdue .todo-deadline { color: var(--danger); font-weight: 700; }
    .todo-deadline svg { width: 11px; height: 11px; }
    .todo-acts {
      display: flex; gap: 0.2rem;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .todo-item:hover .todo-acts { opacity: 1; }
    .todo-acts button {
      background: transparent; border: none;
      color: var(--fg-dim);
      cursor: pointer;
      padding: 2px;
      transition: color 0.12s;
    }
    .todo-acts button:hover { color: var(--accent-bright); }
    .todo-acts .del:hover { color: var(--danger); }
    .todo-acts svg { width: 13px; height: 13px; display: block; }
    .todo-item.pinned .pin-btn svg { color: var(--accent); }
    .todo-empty {
      padding: 2rem 1.5rem;
      text-align: center;
      color: var(--fg-dim);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .todo-footer {
      padding: 0.8rem 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.6rem;
      color: var(--fg-dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      display: flex; justify-content: space-between; align-items: center;
    }
    .todo-clear-btn {
      background: transparent; border: none;
      color: var(--fg-dim); cursor: pointer;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
    }
    .todo-clear-btn:hover { color: var(--danger); }

    /* ─── NOTES APP ─── */
    .notes-modal {
      max-width: 1000px;
      width: 95vw;
      height: 80vh;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .notes-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .notes-header h2 { margin: 0; }
    .notes-body { flex: 1; display: flex; overflow: hidden; }
    .notes-list {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .notes-list-header {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: var(--fg-dim);
      text-transform: uppercase;
    }
    .notes-search {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .notes-search input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .notes-search input:focus { outline: none; border-color: var(--accent); }
    .notes-new {
      background: transparent; border: 1px solid var(--border-strong);
      color: var(--fg-dim);
      width: 22px; height: 22px;
      border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .notes-new:hover { color: var(--accent-bright); border-color: var(--accent); }
    .notes-new svg { width: 10px; height: 10px; }
    .note-row {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .note-row:hover { background: var(--bg-3); }
    .note-row.active {
      background: var(--bg-3);
      border-left-color: var(--accent);
    }
    .note-row-title {
      font-size: 0.85rem;
      color: var(--fg);
      margin-bottom: 0.2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-row-preview {
      font-size: 0.7rem;
      color: var(--fg-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-row-date {
      font-size: 0.6rem;
      color: var(--fg-dimmer);
      letter-spacing: 0.15em;
      margin-top: 0.3rem;
    }
    .note-row mark {
      background: rgba(240, 176, 64, 0.3);
      color: var(--warning);
      padding: 0;
    }
    .notes-editor {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .notes-editor-bar {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      gap: 0.5rem;
    }
    .note-title-input {
      background: transparent;
      border: none;
      color: var(--fg);
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 300;
      flex: 1;
      padding: 0.3rem 0;
    }
    .note-title-input:focus { outline: none; }
    .notes-mode-toggle {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 2px;
    }
    .notes-mode-toggle button {
      background: transparent;
      border: none;
      color: var(--fg-dim);
      padding: 0.3rem 0.7rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }
    .notes-mode-toggle button.active {
      background: var(--accent);
      color: var(--fg);
    }
    .notes-content { flex: 1; overflow: hidden; display: flex; }
    .notes-content textarea {
      width: 100%; height: 100%;
      background: var(--bg);
      border: none;
      color: var(--fg);
      padding: 1.2rem 1.5rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.7;
      resize: none;
    }
    .notes-content textarea:focus { outline: none; }
    .notes-preview {
      flex: 1;
      padding: 1.2rem 1.5rem;
      overflow-y: auto;
      background: var(--bg);
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--fg);
    }
    .notes-preview h1, .notes-preview h2, .notes-preview h3 {
      font-family: var(--display); font-weight: 300;
      margin: 1.2em 0 0.5em; letter-spacing: -0.01em;
    }
    .notes-preview h1 { font-size: 1.7rem; }
    .notes-preview h2 { font-size: 1.3rem; }
    .notes-preview h3 { font-size: 1.05rem; color: var(--fg-dim); }
    .notes-preview p { margin-bottom: 0.8em; }
    .notes-preview code {
      background: var(--bg-3); padding: 0.1em 0.4em;
      border-radius: 3px; font-size: 0.85em; color: var(--accent-bright);
    }
    .notes-preview pre {
      background: var(--bg-3); padding: 0.8rem 1rem;
      border-radius: 6px; overflow-x: auto; margin: 0.8em 0;
      border: 1px solid var(--border);
    }
    .notes-preview pre code { background: transparent; padding: 0; color: var(--fg); }
    .notes-preview blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem; margin: 0.8em 0; color: var(--fg-dim);
    }
    .notes-preview ul, .notes-preview ol { padding-left: 1.5rem; margin-bottom: 0.8em; }
    .notes-preview li { margin-bottom: 0.3em; }
    .notes-preview a { color: var(--accent-bright); text-decoration: underline; }
    .notes-preview hr { border: none; border-top: 1px solid var(--border-strong); margin: 1.5em 0; }
    .notes-preview strong { color: var(--fg); font-weight: 700; }
    .notes-preview em { color: var(--fg); font-style: italic; }
    .notes-empty {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--fg-dim); font-size: 0.8rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }

    /* ─── SETTINGS ─── */
    .settings-modal { max-width: 760px; }
    .settings-section {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .settings-section:last-child { border-bottom: none; }
    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0; gap: 0.8rem;
    }
    .toggle-row-label { font-size: 0.8rem; color: var(--fg); }
    .toggle-row-label small {
      display: block; font-size: 0.65rem;
      color: var(--fg-dim); margin-top: 0.2rem;
    }
    .toggle {
      width: 38px; height: 22px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 100px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--fg-dim);
      border-radius: 50%;
      transition: left 0.15s, background 0.15s;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle.on::after {
      left: calc(100% - 18px);
      background: var(--fg);
    }
    .num-input {
      width: 60px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.85rem;
      text-align: center;
    }
    .num-input:focus { outline: none; border-color: var(--accent); }
    .theme-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.6rem;
      margin-bottom: 1rem;
    }
    .theme-opt {
      padding: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      text-align: left;
    }
    .theme-opt:hover { transform: translateY(-2px); }
    .theme-opt.active { border-color: var(--accent); background: rgba(155, 32, 32, 0.08); }
    .theme-swatches { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; }
    .theme-swatch {
      width: 20px; height: 20px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
    }
    .theme-name {
      font-size: 0.7rem; color: var(--fg);
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .color-row {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.4rem 0;
    }
    .color-row label { flex: 1; font-size: 0.75rem; color: var(--fg-dim); }
    .color-row input[type=color] {
      width: 40px; height: 28px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      cursor: pointer;
      background: var(--bg);
      padding: 2px;
    }
    .color-row input[type=text] {
      width: 100px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .currency-pairs-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .currency-pair-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
    }
    .currency-pair-row select {
      flex: 1;
      background: var(--bg-3);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .currency-pair-row button {
      background: transparent; border: 1px solid var(--border-strong);
      color: var(--fg-dim);
      width: 24px; height: 24px;
      border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .currency-pair-row button:hover { color: var(--danger); }
    .currency-pair-row button svg { width: 10px; height: 10px; }
    .css-warning {
      background: rgba(208, 64, 64, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.8rem;
    }
    .ws-row {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0;
    }
    .ws-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.8rem;
    }
    .ws-row select {
      background: var(--bg-3);
      border: 1px solid var(--border-strong);
      color: var(--fg);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.7rem;
    }
    .ws-row .move-btns {
      display: flex; gap: 2px;
    }
    .ws-row .move-btns button {
      background: transparent; border: 1px solid var(--border-strong);
      color: var(--fg-dim);
      width: 22px; height: 22px;
      border-radius: 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .ws-row .move-btns button:hover { color: var(--fg); }
    .ws-row .move-btns button svg { width: 10px; height: 10px; }

    /* background preview */
    .bg-preview {
      width: 100%; max-width: 360px;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      margin: 0.6rem 0;
      position: relative;
      overflow: hidden;
    }
    .bg-preview-dim {
      position: absolute; inset: 0;
      background: var(--bg);
      pointer-events: none;
    }
    .slider-row {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.3rem 0;
    }
    .slider-row label { flex: 0 0 90px; font-size: 0.7rem; color: var(--fg-dim); }
    .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .slider-row .val { min-width: 40px; text-align: right; font-family: var(--mono); font-size: 0.7rem; color: var(--accent-bright); }

    /* адаптив */
    @media (max-width: 1100px) {
      .grid.view-grid { grid-template-columns: repeat(3, 1fr); }
      .main { padding: 2rem; }
      .clock { font-size: 6rem; }
      .clock-row { gap: 1rem; }
      .deadline-card { min-width: 160px; max-width: 200px; padding: 0.7rem 0.9rem; }
      .deadline-text { font-size: 0.78rem; }
      .notes-modal { width: 98vw; }
      .notes-list { width: 220px; }
    }
    @media (max-width: 700px) {
      .grid.view-grid { grid-template-columns: repeat(2, 1fr); }
      .grid.view-compact { grid-template-columns: repeat(3, 1fr); }
      .grid.view-quickdial { grid-template-columns: repeat(3, 1fr); }
      .clock { font-size: 4rem; }
      .icon-grid { grid-template-columns: repeat(6, 1fr); }
      .main { padding: 1.5rem; }
      .todo-panel { width: 90vw; }
      .clock-row { flex-direction: column; gap: 1rem; }
      .deadline-card { max-width: 90%; }
      .notes-list { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-layer-dim" id="bgLayerDim"></div>

  <!-- ─── MAIN ─── -->
  <div class="main" id="main">
    <div class="topbar">
      <div class="topbar-left">
        <div><span class="status-dot"></span>session active</div>
        <div id="uptime" data-widget="uptime">uptime 00:00</div>
      </div>
      <div class="topbar-right">
        <div class="ipbox" id="ipbox" data-widget="ip" title="click to copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span>ip</span><span class="ip-value" id="ipValue">—</span><span class="ip-country" id="ipCountry"></span>
        </div>
        <div class="weather" id="weather" data-widget="weather" style="opacity:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M17.5 19a4.5 4.5 0 1 0-1.6-8.7 6 6 0 1 0-11.4 2.2A4 4 0 0 0 6 19h11.5z"/></svg>
          <span class="weather-temp">—</span><span class="weather-city" id="weatherCity">kyiv</span>
        </div>
      </div>
    </div>

    <div class="clock-row">
      <div class="deadline-card" id="deadlineCard" style="display:none;"></div>
      <div class="clock-wrap" data-widget="clock">
        <div class="clock">
          <span id="h">00</span><span class="sep">:</span><span id="m">00</span><span class="seconds" id="s">00</span>
        </div>
        <div class="date" id="date">—</div>
        <div class="tz-label">europe / kyiv</div>
      </div>
    </div>

    <div class="ws-tabs" id="wsTabs"></div>
    <div class="grid-wrap">
      <div class="grid view-grid" id="grid"></div>
    </div>

    <div class="footer">
      <div>
        <span id="footerInfo">chessium · console</span>
        <span class="sync-indicator" id="syncIndicator"></span>
      </div>
      <div class="footer-btns">
        <button id="cmdkBtn">search <span class="kbd">ctrl</span>+<span class="kbd">space</span></button>
        <button id="syncBtn" style="display:none;">↑ push</button>
        <button id="exportBtn">export</button>
        <button id="importBtn">import</button>
        <button class="icon-btn" id="settingsBtn" title="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.6 1.65 1.65 0 0010 3.09V3a2 2 0 014 0v.09c0 .66.39 1.26 1 1.51a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.25.61.85 1 1.51 1H21a2 2 0 010 4h-.09c-.66 0-1.26.39-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- FAB for empty workspace -->
  <button class="fab" id="fab" title="add tile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- AI BAR -->
  <div class="aibar" id="aibar" style="display:none;" data-widget="aibar">
    <svg class="aibar-lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="aiInput" placeholder="type a query — Enter to search…" autocomplete="off">
    <div class="ai-engines" id="aiEngines">
      <div class="ai-group" id="aiGroup"></div>
      <div class="ai-divider"></div>
      <div class="ai-group" id="searchGroup"></div>
    </div>
  </div>

  <!-- TODO PANEL -->
  <button class="todo-toggle" id="todoToggle" style="display:none;" data-widget="todo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
    <span class="badge" id="todoBadge" style="display:none;">0</span>
  </button>
  <div class="todo-panel" id="todoPanel">
    <div class="todo-header">
      <h2>Tasks</h2>
      <button class="todo-close" id="todoClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="todo-add">
      <div class="todo-add-row">
        <input type="text" id="todoInput" placeholder="add a task…">
        <button class="todo-add-btn" id="todoAddBtn">+</button>
      </div>
      <div class="todo-add-row">
        <input type="datetime-local" id="todoDeadline" title="optional deadline">
        <button class="todo-add-clear" id="todoDeadlineClear" title="clear deadline">×</button>
      </div>
    </div>
    <div class="todo-list" id="todoList"></div>
    <div class="todo-footer">
      <span><span id="todoStats">0 of 0</span></span>
      <button class="todo-clear-btn" id="todoClearDone">clear done</button>
    </div>
  </div>

  <!-- NOTES MODAL -->
  <div class="modal-backdrop" id="notesBackdrop">
    <div class="modal notes-modal">
      <div class="notes-header">
        <h2>Notes</h2>
        <button class="todo-close" id="notesClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="notes-body">
        <div class="notes-list" id="notesList">
          <div class="notes-list-header">
            <span>all notes</span>

  const IDB_NAME = 'chessium_store';
  const IDB_STORE = 'blobs';
  let idbPromise = null;
  function idbOpen() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('no indexeddb')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbPromise;
  }
  async function idbGet(key) {
    try {
      const db = await idbOpen();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function idbSet(key, value) {
    try {
      const db = await idbOpen();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    } catch { return false; }
  }
  async function idbDel(key) {
    try {
      const db = await idbOpen();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');

        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);

  function pad(n) { return String(n).padStart(2, '0'); }

    const now = new Date();
    const parts = timeFmt.formatToParts(now);
    const h = parts.find(p => p.type === 'hour').value;
    const m = parts.find(p => p.type === 'minute').value;
    const s = parts.find(p => p.type === 'second').value;
    if (h !== lastH) { hEl.textContent = h; lastH = h; }
    if (m !== lastM) { mEl.textContent = m; lastM = m; }
    if (s !== lastS) { sEl.textContent = s; lastS = s; }

    if (now - lastDeadlineCheck > 30000) {
      updateDeadlineBadge();
      if (todoPanel.classList.contains('open')) renderTodos();

  // ═══════════ DEADLINE BADGE (variant B) ═══════════
  function formatDeadlineRel(ts) {
    const diff = ts - Date.now();
    const abs = Math.abs(diff);
    const overdue = diff < 0;
    const mins = Math.floor(abs / 60000);
    const hours = Math.floor(mins / 60);
    const days = Math.floor(hours / 24);
    if (mins < 1) return overdue ? 'just overdue' : 'in <1m';
    if (mins < 60) return overdue ? mins + 'm ago' : 'in ' + mins + 'm';
    if (hours < 24) return overdue ? hours + 'h ago' : 'in ' + hours + 'h ' + (mins % 60) + 'm';
    return overdue ? days + 'd ago' : 'in ' + days + 'd ' + (hours % 24) + 'h';
  }
  function findMostUrgentTodo() {
    let candidate = null;
    for (const t of todos) {
      if (t.done || !t.deadline) continue;
      if (t.deadline - Date.now() > 3600 * 1000) continue;
      if (!candidate || t.deadline < candidate.deadline) candidate = t;
    }
    return candidate;
  }
  function updateDeadlineBadge() {
    if (!settings.widgets.deadline) { deadlineCard.style.display = 'none'; return; }
    const t = findMostUrgentTodo();
    if (!t) { deadlineCard.style.display = 'none'; return; }
    const overdue = (t.deadline - Date.now()) < 0;
    deadlineCard.classList.toggle('overdue', overdue);
    deadlineCard.classList.add('pulse');
    deadlineCard.style.display = 'block';
    const fullTime = new Date(t.deadline).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    deadlineCard.innerHTML =
      '<div class="deadline-label">' + (overdue ? 'overdue' : 'due soon') + '</div>' +
      '<div class="deadline-text">' + escapeHtml(t.text) + '</div>' +

  }

        back.classList.remove('drag-over');

        e.preventDefault();

        if (moved && moved.parent) {

          moved.parent = null;
          if (folderObj) moved.ws = folderObj.ws;

    if (dragId && targetWs) {

  // ═══════════ GRID ═══════════
  function getVisibleBookmarks() {
    if (currentFolder) return bookmarks.filter(b => b.parent === currentFolder);
    return bookmarks.filter(b => !b.parent && b.ws === settings.activeWs);
  }
  function getQuickLaunchMap() {
    if (!settings.quickLaunch) return {};
    const items = getVisibleBookmarks().filter(b => !b.type && !b.tool && b.url);
    const map = {};
    items.slice(0, 9).forEach((b, i) => { map[b.id] = i + 1; });

  }
  let _renderQueued = false;

    // coalesce bursts of renderGrid() calls in the same frame into one paint

    requestAnimationFrame(() => {
      _renderQueued = false;
      renderGridNow();
    });
  }
  function renderGridNow() {
    const ws = activeWs();
    const viewMode = ws.viewMode || 'grid';
    grid.className = 'grid view-' + viewMode;
    grid.style.setProperty('--cols', ws.cols || 4);

    const items = getVisibleBookmarks();
    const qlMap = getQuickLaunchMap();
    const frag = document.createDocumentFragment();
    items.forEach(b => frag.appendChild(makeTile(b, qlMap[b.id])));

    if (!currentFolder) {
      (settings.currencyPairs || []).forEach(pair => {
        if (pair.ws === settings.activeWs || !pair.ws) frag.appendChild(makeCurrencyTile(pair));
      });
    }

    grid.innerHTML = '';
    const currCount = currentFolder ? 0 : (settings.currencyPairs || []).filter(p => p.ws === settings.activeWs || !p.ws).length;
    if (items.length === 0 && currCount === 0) {
      const empty = document.createElement('div');
      empty.className = 'grid-empty';
      empty.innerHTML = 'this workspace is empty<div class="hint">right-click to add &middot; <span class="kbd">Ctrl</span>+<span class="kbd">N</span></div>';
      grid.appendChild(empty);

      grid.appendChild(frag);

  function makeTile(b, hotkey) {
    const isTool = !!b.tool;
    const isFolder = b.type === 'folder';
    const tile = document.createElement(isTool || isFolder ? 'div' : 'a');
    tile.className = 'tile' + (isTool ? ' tile-tool' : '') + (isFolder ? ' tile-folder' : '') + (b.color ? ' has-color' : '');
    tile.dataset.id = b.id;
    if (b.color) tile.style.setProperty('--tile-color', b.color);
    if (!isTool && !isFolder) {
      tile.href = b.url;
      tile.target = '_blank';
      tile.rel = 'noopener';
    }
    tile.draggable = true;
    let host;
    if (isTool) host = b.tool === 'notes' ? 'local · autosaved' : 'local tool';
    else if (isFolder) {
      const count = bookmarks.filter(x => x.parent === b.id).length;
      host = count + ' item' + (count !== 1 ? 's' : '');
    } else {
      try { host = new URL(b.url).hostname.replace(/^www\./, ''); } catch { host = b.url || ''; }
    }
    const hotkeyHtml = hotkey ? '<div class="tile-hotkey">' + hotkey + '</div>' : '';
    tile.innerHTML =
      '<div class="tile-head">' +
        tileIconHtml(b, isFolder) +
        '<div class="tile-label">' + escapeHtml(b.label || '') + '</div>' +
      '</div>' +
      '<div class="tile-name">' + escapeHtml(b.name || 'Unnamed') + '</div>' +
      '<div class="tile-host">' + escapeHtml(host) + '</div>' +
      hotkeyHtml;
    // if a favicon fails to load, fall back to the default link/folder glyph
    const favImg = tile.querySelector('.tile-favicon');
    if (favImg) {
      favImg.addEventListener('error', () => {
        const tmp = document.createElement('div');
        tmp.innerHTML = iconSvg(isFolder ? 'folder' : 'link');

  function makeCurrencyTile(pair) {
    const tile = document.createElement('div');
    tile.className = 'tile tile-curr';
    tile.dataset.curr = pair.from + '_' + pair.to;
    const rates = currCache.rates, prevRates = currCache.prevRates;
    let val = '—', deltaHtml = '', deltaCls = 'flat';
    if (rates && rates[pair.from] && rates[pair.to]) {
      const cur = rates[pair.to] / rates[pair.from];
      val = cur.toFixed(cur < 10 ? 4 : 2);
      if (prevRates && prevRates[pair.from] && prevRates[pair.to]) {
        const prev = prevRates[pair.to] / prevRates[pair.from];
        const diff = cur - prev;
        const pct = ((diff / prev) * 100).toFixed(2);
        if (Math.abs(diff) > 1e-6) {
          deltaCls = diff > 0 ? 'up' : 'down';
          const arrow = diff > 0
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l5-5 5 5M7 7l5-5 5 5"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l5 5 5-5M7 17l5 5 5-5"/></svg>';
          deltaHtml = arrow + ' ' + (diff > 0 ? '+' : '') + pct + '%';
        } else deltaHtml = '— flat';
      } else deltaHtml = '— first run';
    }
    tile.innerHTML =
      '<div class="tile-head">' + iconSvg('bar') + '<div class="tile-label">currency</div></div>' +
      '<div class="curr-pair-name">' + escapeHtml(pair.from) + ' → ' + escapeHtml(pair.to) + '</div>' +
      '<div class="curr-big">' + val + '</div>' +
      '<div class="curr-delta ' + deltaCls + '">' + deltaHtml + '</div>' +
      '<div class="tile-actions">' +
        '<button class="tile-act danger" data-action="curr-remove" data-pair="' + escapeHtml(pair.from) + '_' + escapeHtml(pair.to) + '" title="remove pair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button>' +
      '</div>';
    return tile;
  }

  // long-press → context menu (touch devices)
  let lpTimer = null, lpStartX = 0, lpStartY = 0, lpTarget = null, lpFired = false;
  const LP_DELAY = 480, LP_MOVE_TOL = 12;
  function cancelLongPress() {
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }

  }
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { cancelLongPress(); return; }

    lpFired = false;
    const tile = e.target.closest('.tile');
    const onMain = e.target.closest('.main') && !e.target.closest('.modal') &&
      !e.target.closest('.todo-panel') && !e.target.closest('.aibar') &&
      !e.target.closest('.ws-tabs') && !e.target.closest('.footer');
    if (tile && tile.dataset.id && !tile.classList.contains('tile-curr')) {
      lpTarget = { type: 'tile', id: tile.dataset.id };

  function renderMarkdown(src) {
    let s = escapeHtml(src);
    s = s.replace(/```([\s\S]*?)```/g, (_, c) => '<pre><code>' + c.trim() + '</code></pre>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/^---+$/gm, '<hr>');
    s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^[-*] .+(?:\n[-*] .+)*)/gm, (block) => '<ul>' + block.split('\n').map(l => l.replace(/^[-*] (.+)/, '<li>$1</li>')).join('') + '</ul>');

    s = s.split(/\n{2,}/).map(p => /^<(h\d|ul|ol|pre|blockquote|hr)/.test(p.trim()) ? p : (p.trim() ? '<p>' + p.replace(/\n/g, '<br>') + '</p>' : '')).join('\n');
    return s;
  }

  function classifyTodo(t) {

  function renderTodos() {

    const done = todos.filter(t => t.done);
    if (pinned.length + active.length + done.length === 0) {
      todoListEl.innerHTML = '<div class="todo-empty">no tasks yet</div>';
      todoStats.textContent = '0 of 0';
      todoBadge.style.display = 'none';

      if (!arr.length) return;

      frag.appendChild(lbl);

    section('pinned', pinned);
    section('active', active);
    section('done', done);

  // ═══════════ PASSWORD GENERATOR ═══════════
  const passBackdrop = $('passBackdrop');
  const pgResult = $('pgResult');
  const pgLen = $('pgLen');
  const pgLenVal = $('pgLenVal');
  const WORDS = ['apple', 'river', 'cloud', 'stone', 'tiger', 'plant', 'horse', 'tower', 'glass', 'field', 'green', 'quick', 'smart', 'solid', 'brave', 'light', 'north', 'south', 'metal', 'paper', 'swift', 'prime', 'spark', 'flame', 'frost', 'storm', 'ocean', 'piano', 'quiet', 'vivid', 'radio', 'jazz', 'lemon', 'mango', 'peach', 'onyx', 'ruby', 'jade', 'amber', 'coral', 'noble', 'silver', 'gold', 'crimson', 'azure', 'olive', 'indigo', 'violet', 'bronze', 'copper', 'marble', 'crystal'];
  function randomFrom(chars, len) {
    const buf = new Uint32Array(len);
    crypto.getRandomValues(buf);
    let out = '';
    for (let i = 0; i < len; i++) out += chars[buf[i] % chars.length];
    return out;
  }
  function generatePassword() {
    const len = parseInt(pgLen.value, 10);
    let r;
    if (currentPreset === 'strong') r = randomFrom('abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*-_=+', len);
    else if (currentPreset === 'safe') r = randomFrom('abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', len);
    else if (currentPreset === 'words') {
      const count = Math.max(3, Math.min(6, Math.floor(len / 6)));
      const buf = new Uint32Array(count);
      crypto.getRandomValues(buf);
      const w = [];
      for (let i = 0; i < count; i++) w.push(WORDS[buf[i] % WORDS.length]);
      const num = new Uint32Array(1);
      crypto.getRandomValues(num);
      r = w.join('-') + '-' + (num[0] % 100);
    } else if (currentPreset === 'pin') r = randomFrom('0123456789', Math.min(8, len));
    pgResult.textContent = r;
  }

  async function runEngine(id) {

    } else {
      try { await navigator.clipboard.writeText(q); showToast('prompt copied — opening ' + cfg.name); }
