  // ═══════════ COMMAND PALETTE ═══════════
  const cmdk = $('cmdk');
  const cmdkInput = $('cmdkInput');
  const cmdkList = $('cmdkList');
  function openCmdk() {
    cmdk.classList.add('active');
    cmdkInput.value = '';
    cmdkIdx = 0;
    renderCmdk('');
    setTimeout(() => cmdkInput.focus(), 50);
  }
  function closeCmdk() { cmdk.classList.remove('active'); }
  function renderCmdk(query) {
    const q = query.trim().toLowerCase();
    cmdkItems = [];
    cmdkList.innerHTML = '';
    const m = q.match(/^(g|gh|yt|tw|so)\s+(.+)/);
    if (m) {
      const cmd = m[1], term = m[2];
      const map = {
        g: { name: 'Google', url: 'https://google.com/search?q=' + encodeURIComponent(term), icon: 'globe', hint: 'google' },
        gh: { name: 'GitHub', url: 'https://github.com/search?q=' + encodeURIComponent(term), icon: 'git', hint: 'github' },
        yt: { name: 'YouTube', url: 'https://youtube.com/results?search_query=' + encodeURIComponent(term), icon: 'youtube', hint: 'youtube' },
        tw: { name: 'Twitter', url: 'https://twitter.com/search?q=' + encodeURIComponent(term), icon: 'twitter', hint: 'twitter' },
        so: { name: 'Stack Overflow', url: 'https://stackoverflow.com/search?q=' + encodeURIComponent(term), icon: 'code', hint: 'so' }
      };
      cmdkItems.push(Object.assign({ type: 'link' }, map[cmd], { queryHint: '"' + term + '"' }));
    }
    // bookmarks
    bookmarks.filter(b => !b.tool && !b.type).forEach(b => {
      const hay = (b.name + ' ' + (b.label || '') + ' ' + (b.url || '')).toLowerCase();
      if (!q || hay.includes(q)) cmdkItems.push({ type: 'link', name: b.name, url: b.url, icon: b.icon || 'link', hint: b.label || '' });
    });
    // notes
    if (q) {
      notes.forEach(n => {
        const hay = ((n.title || '') + ' ' + (n.content || '')).toLowerCase();
        if (hay.includes(q)) cmdkItems.push({ type: 'note', name: n.title || 'untitled', noteId: n.id, icon: 'file', hint: 'note' });
      });
    }
    // commands
    const cmds = [
      { name: 'Add bookmark', action: 'add-bookmark', icon: 'link', hint: 'cmd' },
      { name: 'Add folder', action: 'add-folder', icon: 'folder', hint: 'cmd' },
      { name: 'Open settings', action: 'settings', icon: 'settings', hint: 'cmd' },
      { name: 'Open notes', action: 'notes', icon: 'file', hint: 'cmd' },
      { name: 'Open tasks', action: 'tasks', icon: 'list', hint: 'cmd' },
      { name: 'Push to GitHub Gist', action: 'sync-push', icon: 'upload', hint: 'cmd' },
      { name: 'Pull from GitHub Gist', action: 'sync-pull', icon: 'download', hint: 'cmd' }
    ];
    cmds.forEach(c => {
      if (!q || c.name.toLowerCase().includes(q)) cmdkItems.push(Object.assign({ type: 'cmd' }, c));
    });
    if (q && !m) {
      cmdkItems.push({ type: 'link', name: 'Search Google for "' + query + '"', url: 'https://google.com/search?q=' + encodeURIComponent(query), icon: 'globe', hint: 'fallback' });
    }
    if (cmdkItems.length === 0) {
      cmdkList.innerHTML = '<div class="cmdk-empty">type to search · enter for google</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    cmdkItems.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'cmdk-item' + (i === cmdkIdx ? ' active' : '');
      el.dataset.i = i;
      let host = '';
      if (it.url) { try { host = new URL(it.url).hostname.replace(/^www\./, ''); } catch { host = it.url; } }
      el.innerHTML =
        iconSvg(it.icon, '') +
        '<div class="cmdk-item-text">' +
          '<div class="cmdk-item-name">' + escapeHtml(it.name) + (it.queryHint ? ' · ' + escapeHtml(it.queryHint) : '') + '</div>' +
          (host ? '<div class="cmdk-item-host">' + escapeHtml(host) + '</div>' : '') +
        '</div>' +
        '<div class="cmdk-item-hint">' + escapeHtml(it.hint || '') + '</div>';
      frag.appendChild(el);
    });
    cmdkList.appendChild(frag);
  }
  function execCmdkItem(it) {
    if (!it) return;
    closeCmdk();
    if (it.type === 'link') window.open(it.url, '_blank', 'noopener');
    else if (it.type === 'note') { openNotes(); selectNote(it.noteId); }
    else if (it.type === 'cmd') {
      if (it.action === 'add-bookmark') openAddModal('bookmark');
      else if (it.action === 'add-folder') openAddModal('folder');
      else if (it.action === 'settings') openSettings();
      else if (it.action === 'notes') openNotes();
      else if (it.action === 'tasks') todoPanel.classList.add('open');
      else if (it.action === 'sync-push') syncPush();
      else if (it.action === 'sync-pull') syncPull();
    }
  }
  cmdkList.addEventListener('click', (e) => {
    const el = e.target.closest('.cmdk-item');

  });
  cmdkList.addEventListener('mouseover', (e) => {
    const el = e.target.closest('.cmdk-item');
    if (!el) return;
    cmdkIdx = +el.dataset.i;
    cmdkList.querySelectorAll('.cmdk-item').forEach((c, j) => c.classList.toggle('active', j === cmdkIdx));
  });
  cmdkInput.addEventListener('input', () => { cmdkIdx = 0; renderCmdk(cmdkInput.value); });
  cmdkInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeCmdk(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdkIdx = Math.min(cmdkIdx + 1, cmdkItems.length - 1); renderCmdk(cmdkInput.value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkIdx = Math.max(cmdkIdx - 1, 0); renderCmdk(cmdkInput.value); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const it = cmdkItems[cmdkIdx];
      if (it) execCmdkItem(it);
      else if (cmdkInput.value.trim()) { window.open('https://google.com/search?q=' + encodeURIComponent(cmdkInput.value), '_blank', 'noopener'); closeCmdk(); }
    }
  });
  cmdk.addEventListener('click', (e) => { if (e.target === cmdk) closeCmdk(); });
  $('cmdkBtn').addEventListener('click', openCmdk);

  const ipbox = $('ipbox');

  async function fetchIp() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const j = await r.json();
      currentIp = j.ip;
      ipValue.textContent = currentIp;
    } catch { ipValue.textContent = 'offline'; }
    if (settings.widgets.ipCountry) fetchIpCountry();
  }
  async function fetchIpCountry() {
    try {
      const r = await fetch('https://ipapi.co/json/');
      const j = await r.json();
      if (j && j.country_code) {
        currentIpCountry = j.country_code;
        ipCountryEl.textContent = '· ' + j.country_code;
      }
    } catch { /* silent */ }
  }
  ipbox.addEventListener('click', async () => {
    if (!currentIp) return;
    try {
      await navigator.clipboard.writeText(currentIp);
      ipbox.classList.add('copied');
      showToast('ip copied');
      setTimeout(() => ipbox.classList.remove('copied'), 1200);
    } catch { showToast('clipboard blocked', 'error'); }
  });
  async function fetchWeather() {
    const city = settings.weatherCity || { name: 'Kyiv', lat: 50.45, lon: 30.52 };
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon + '&current=temperature_2m');
      const j = await r.json();
      const t = Math.round(j.current.temperature_2m);
      const wEl = $('weather');
      wEl.querySelector('.weather-temp').textContent = (t > 0 ? '+' : '') + t + '°';
      $('weatherCity').textContent = city.name.toLowerCase();
      wEl.style.transition = 'opacity 0.5s';
      wEl.style.opacity = '1';
    } catch { /* silent */ }
  }
  async function fetchRates(force) {
    const now = Date.now();
    if (!force && currCache.rates && currCache.updated && (now - currCache.updated < 6 * 3600 * 1000)) {
      renderGrid();
      return;
    }
    try {
      const r = await fetch('https://open.er-api.com/v6/latest/USD');
      const j = await r.json();
      if (j.result !== 'success') throw new Error('rate api failed');
      if (currCache.rates) currCache.prevRates = currCache.rates;
      currCache.rates = j.rates;
      currCache.updated = now;
      save(CURR_CACHE_KEY, currCache);
      renderGrid();
      if (force) showToast('rates updated');
    } catch {
      if (force) showToast('rates offline', 'error');
    }
  }

  // applyImportedData: applies a backup. preserveSync=true keeps local sync creds
  // (used by pull, so a backup with stale/empty token doesn't kill syncing).
  function applyImportedData(data, preserveSync) {
    const keepSync = preserveSync ? Object.assign({}, settings.sync) : null;
    if (data.bookmarks) { bookmarks = data.bookmarks; save(DATA_KEY, bookmarks); }
    if (data.workspaces) {
      workspaces = data.workspaces;
      workspaces.forEach(w => { if (typeof w.cols !== 'number') w.cols = 4; if (!w.viewMode) w.viewMode = 'grid'; });
      save(WS_KEY, workspaces);
    }
    if (data.settings) {
      settings = deepMerge(DEFAULT_SETTINGS, data.settings);
      if (keepSync) settings.sync = keepSync;
      save(SETTINGS_KEY, settings);
    }
    if (data.notes) { notes = data.notes; save(NOTES_KEY, notes); }
    if (data.todos) { todos = data.todos; save(TODO_KEY, todos); }
    if (!workspaces.find(w => w.id === settings.activeWs)) settings.activeWs = workspaces[0].id;
    applyTheme();
    applyBg();
    renderWsTabs();
    renderGrid();
    renderTodos();
    applyWidgetVisibility();
    updateDeadlineBadge();
  }
  // Read GitHub error body for a human message
  async function ghError(resp) {
    let detail = '';
    try {
      const j = await resp.json();
      if (j && j.message) detail = j.message;
    } catch (e) { /* ignore */ }
    const map = {
      401: 'bad credentials — token invalid or expired',
      403: 'forbidden — token lacks "gist" scope or rate-limited',
      404: 'not found — gist id wrong or token can\'t see it',
      422: 'unprocessable — malformed request'
    };
    return 'HTTP ' + resp.status + (map[resp.status] ? ' · ' + map[resp.status] : '') + (detail ? ' (' + detail + ')' : '');
  }
  async function syncPush() {
    const s = settings.sync || {};
    if (!s.token) { showToast('set GitHub token in settings', 'error'); openSettings('sync'); return; }
    setSyncStatus('syncing', 'pushing…');
    console.log('[sync] push start. gistId=', s.gistId || '(none, will create)');
    const payload = collectData();
    const body = { description: 'chessium console backup · ' + new Date().toISOString(), files: {} };
    body.files[GIST_FILENAME] = { content: JSON.stringify(payload, null, 2) };
    try {
      let resp;
      if (s.gistId) {
        resp = await fetch('https://api.github.com/gists/' + s.gistId, {
          method: 'PATCH',
          headers: { 'Authorization': 'token ' + s.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
          body: JSON.stringify(body)
        });
        // gist deleted on remote? recreate
        if (resp.status === 404) {
          console.warn('[sync] gist 404 on PATCH — recreating');
          settings.sync.gistId = '';
          body.public = false;
          resp = await fetch('https://api.github.com/gists', {
            method: 'POST',
            headers: { 'Authorization': 'token ' + s.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
            body: JSON.stringify(body)
          });
        }
      } else {
        body.public = false;
        resp = await fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: { 'Authorization': 'token ' + s.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
          body: JSON.stringify(body)
        });
      }
      console.log('[sync] push response status', resp.status);
      if (!resp.ok) {
        const msg = await ghError(resp);
        throw new Error(msg);
      }
      const j = await resp.json();
      settings.sync.gistId = j.id;
      settings.sync.lastSync = payload._meta.savedAt;
      save(SETTINGS_KEY, settings);
      console.log('[sync] push ok. gistId=', j.id);
      setSyncStatus('ok', 'pushed');
      showToast('pushed to gist', 'success');
      return true;
    } catch (e) {
      console.error('[sync] push failed:', e);
      setSyncStatus('error', 'push failed');
      showToast('push failed: ' + e.message, 'error');
      return false;
    }
  }
  async function syncPull() {
    const s = settings.sync || {};
    if (!s.token) { showToast('set GitHub token in settings', 'error'); openSettings('sync'); return; }
    if (!s.gistId) { showToast('no gist id — push once first', 'error'); openSettings('sync'); return; }
    setSyncStatus('syncing', 'pulling…');
    console.log('[sync] pull start. gistId=', s.gistId);
    try {
      const resp = await fetch('https://api.github.com/gists/' + s.gistId, {
        headers: { 'Authorization': 'token ' + s.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
      });
      console.log('[sync] pull response status', resp.status);
      if (!resp.ok) {
        const msg = await ghError(resp);
        throw new Error(msg);
      }
      const j = await resp.json();
      const file = j.files && j.files[GIST_FILENAME];
      if (!file) throw new Error('file "' + GIST_FILENAME + '" not found in gist');
      let content = file.content;
      if (file.truncated && file.raw_url) {
        console.log('[sync] file truncated, fetching raw');
        const raw = await fetch(file.raw_url);
        content = await raw.text();
      }
      const data = JSON.parse(content);
      const remoteAt = data._meta && data._meta.savedAt ? data._meta.savedAt : 0;
      const localAt = s.lastSync || 0;
      if (remoteAt && localAt && remoteAt < localAt) {
        if (!confirm('Remote backup is OLDER than your local data.\nRemote: ' + new Date(remoteAt).toLocaleString() + '\nLocal:  ' + new Date(localAt).toLocaleString() + '\n\nPull anyway and overwrite local?')) {
          setSyncStatus('', '');
          return false;
        }
      } else if (remoteAt) {
        if (!confirm('Pull from gist? This will REPLACE current local data.\nRemote saved: ' + new Date(remoteAt).toLocaleString())) {
          setSyncStatus('', '');
          return false;
        }
      }
      applyImportedData(data, true); // preserve local sync creds
      settings.sync.lastSync = Date.now();
      save(SETTINGS_KEY, settings);
      console.log('[sync] pull ok');
      setSyncStatus('ok', 'pulled');
      showToast('pulled from gist', 'success');
      return true;
    } catch (e) {
      console.error('[sync] pull failed:', e);
      setSyncStatus('error', 'pull failed');
      showToast('pull failed: ' + e.message, 'error');
      return false;
    }
  }

        let added = 0;

          if (!url || !/^https?:/i.test(url)) return;
          const name = (a.textContent || '').trim() || url;
          let host = '';
          try { host = new URL(url).hostname.replace(/^www\./, ''); } catch {}
          bookmarks.push({ id: uid(), label: '', name: name.slice(0, 40), url: url, icon: 'link', color: null, ws: settings.activeWs, parent: null });
          added++;

  // ═══════════ CUSTOM BACKGROUND ═══════════
  function processBgImage(file, cb) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // resize to max 1920px on longest side
        const maxDim = 1920;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => showToast('invalid image', 'error');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    // weather city
    const wcs = $('weatherCitySearch');
    if (wcs) wcs.addEventListener('click', async () => {
      const name = $('weatherCityInput').value.trim();
      if (!name) return;
      wcs.textContent = '...';
      try {
        const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(name));
        const j = await r.json();
        if (!j.results || !j.results.length) { showToast('city not found', 'error'); wcs.textContent = 'set'; return; }
        const res = j.results[0];
        settings.weatherCity = { name: res.name, lat: res.latitude, lon: res.longitude };
        save(SETTINGS_KEY, settings);
        fetchWeather();
        showToast('city set: ' + res.name + ', ' + (res.country || ''));
        buildSettingsUI();
      } catch {
        showToast('geocoding failed', 'error');
        wcs.textContent = 'set';
      }
    });

    // currency pairs
    renderCurrencyPairs();
    const acp = $('addCurrencyPair');
    if (acp) acp.addEventListener('click', () => {
      settings.currencyPairs.push({ from: 'USD', to: 'UAH', ws: settings.activeWs });
      save(SETTINGS_KEY, settings);
      renderCurrencyPairs();
      renderGrid();
    });

    // workspaces
    renderWsSettings();
    const newWsInput = $('newWsInput');
    const addWsBtn = $('addWsBtn');
    if (addWsBtn) addWsBtn.addEventListener('click', () => {
      const v = newWsInput.value.trim();
      if (!v) return;
      let id = v.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      if (!id) id = 'ws-' + uid().slice(0, 4);
      if (workspaces.find(w => w.id === id)) { showToast('already exists', 'error'); return; }
      workspaces.push({ id: id, name: v.toUpperCase(), viewMode: 'grid', cols: 4 });
      save(WS_KEY, workspaces);
      newWsInput.value = '';
      renderWsSettings();
      renderWsTabs();
    });
    if (newWsInput) newWsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addWsBtn.click(); });

    // sync
    function readSyncFields() {
      if (!settings.sync) settings.sync = { gistId: '', token: '', lastSync: 0, autoPull: false };
      const tokEl = $('syncToken'), idEl = $('syncGistId');
      if (tokEl) settings.sync.token = tokEl.value.trim();
      if (idEl) settings.sync.gistId = idEl.value.trim();
      save(SETTINGS_KEY, settings);
    }
    const syncSave = $('syncSaveBtn');
    if (syncSave) syncSave.addEventListener('click', () => {
      readSyncFields();
      updateSyncUi();
      showToast('sync settings saved');
    });
    const sp = $('syncPushBtn');
    if (sp) sp.addEventListener('click', () => {
      readSyncFields();
      syncPush().then(ok => { if (ok) buildSettingsUI(); });
    });
    const spl = $('syncPullBtn');
    if (spl) spl.addEventListener('click', () => {
      readSyncFields();
      syncPull().then(ok => { if (ok) buildSettingsUI(); });
    });
    const apT = settingsBody.querySelector('[data-autopull]');
    if (apT) apT.addEventListener('click', () => {
      if (!settings.sync) settings.sync = { gistId: '', token: '', lastSync: 0, autoPull: false };
      settings.sync.autoPull = !settings.sync.autoPull;
      apT.classList.toggle('on', settings.sync.autoPull);
      save(SETTINGS_KEY, settings);
    });
    const pwaBtn = $('pwaInstallBtn');
    if (pwaBtn) {
      updateInstallButton();
      pwaBtn.addEventListener('click', triggerInstall);
    }
  }

  function renderCurrencyPairs() {
    const wrap = $('currencyPairsList');
    if (!wrap) return;
    wrap.innerHTML = '';
    const currencies = ['USD', 'EUR', 'UAH', 'PLN', 'GBP', 'RUB', 'CHF', 'CNY', 'JPY', 'TRY', 'KZT', 'BYN'];
    settings.currencyPairs.forEach((pair, i) => {
      const row = document.createElement('div');
      row.className = 'currency-pair-row';
      const fromSel = document.createElement('select');
      const toSel = document.createElement('select');
      currencies.forEach(c => { fromSel.appendChild(new Option(c, c)); toSel.appendChild(new Option(c, c)); });
      fromSel.value = pair.from;
      toSel.value = pair.to;
      const wsSel = document.createElement('select');
      workspaces.forEach(w => wsSel.appendChild(new Option(w.name, w.id)));
      wsSel.value = pair.ws || settings.activeWs;
      const arrow = document.createElement('span');
      arrow.textContent = '→';
      arrow.style.color = 'var(--fg-dim)';
      const atSign = document.createElement('span');
      atSign.textContent = '@';
      atSign.style.color = 'var(--fg-dim)';
      const del = document.createElement('button');
      del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
      del.addEventListener('click', () => { settings.currencyPairs.splice(i, 1); save(SETTINGS_KEY, settings); renderCurrencyPairs(); renderGrid(); });
      fromSel.addEventListener('change', () => { settings.currencyPairs[i].from = fromSel.value; save(SETTINGS_KEY, settings); renderGrid(); });
      toSel.addEventListener('change', () => { settings.currencyPairs[i].to = toSel.value; save(SETTINGS_KEY, settings); renderGrid(); });
      wsSel.addEventListener('change', () => { settings.currencyPairs[i].ws = wsSel.value; save(SETTINGS_KEY, settings); renderGrid(); });
      row.appendChild(fromSel);
      row.appendChild(arrow);
      row.appendChild(toSel);
      row.appendChild(atSign);
      row.appendChild(wsSel);
      row.appendChild(del);
      wrap.appendChild(row);
    });
  }
  function renderWsSettings() {
    const wrap = $('wsListSettings');
    if (!wrap) return;
    wrap.innerHTML = '';
    workspaces.forEach((w, i) => {
      const row = document.createElement('div');
      row.className = 'ws-row';
      const name = document.createElement('input');
      name.value = w.name;
      name.addEventListener('input', () => { w.name = name.value; save(WS_KEY, workspaces); renderWsTabs(); });
      const moveBox = document.createElement('div');
      moveBox.className = 'move-btns';
      const up = document.createElement('button');
      up.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
      up.disabled = i === 0;
      up.addEventListener('click', () => {
        if (i === 0) return;
        const tmp = workspaces[i - 1];
        workspaces[i - 1] = workspaces[i];
        workspaces[i] = tmp;
        save(WS_KEY, workspaces);
        renderWsSettings();
        renderWsTabs();
      });
      const down = document.createElement('button');
      down.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      down.disabled = i === workspaces.length - 1;
      down.addEventListener('click', () => {
        if (i === workspaces.length - 1) return;
        const tmp = workspaces[i + 1];
        workspaces[i + 1] = workspaces[i];
        workspaces[i] = tmp;
        save(WS_KEY, workspaces);
        renderWsSettings();
        renderWsTabs();
      });
      moveBox.appendChild(up);
      moveBox.appendChild(down);
      const del = document.createElement('button');
      del.className = 'btn btn-small btn-danger';
      del.textContent = 'remove';
      del.addEventListener('click', () => {
        if (workspaces.length <= 1) { showToast('cannot delete the last workspace', 'error'); return; }
        const itemCount = bookmarks.filter(b => b.ws === w.id).length;
        const msg = itemCount > 0
          ? 'Delete "' + w.name + '"? ' + itemCount + ' tile(s) move to the first workspace.'
          : 'Delete "' + w.name + '"?';
        if (!confirm(msg)) return;
        const fallback = workspaces.find(x => x.id !== w.id).id;
        bookmarks.forEach(b => { if (b.ws === w.id) b.ws = fallback; });
        workspaces.splice(i, 1);
        save(WS_KEY, workspaces);
        save(DATA_KEY, bookmarks);
        if (settings.activeWs === w.id) { settings.activeWs = fallback; save(SETTINGS_KEY, settings); }
        renderWsSettings();
        renderWsTabs();
        renderGrid();
      });
      row.appendChild(moveBox);
      row.appendChild(name);
      row.appendChild(del);
      wrap.appendChild(row);
    });
  }

  $('resetAllBtn').addEventListener('click', () => {
    if (confirm('Reset EVERYTHING to defaults? (bookmarks, notes, tasks, settings, workspaces, background)')) {
      [DATA_KEY, SETTINGS_KEY, WS_KEY, NOTES_KEY, TODO_KEY, CURR_CACHE_KEY, BG_KEY].forEach(k => localStorage.removeItem(k));
      location.reload();
    }
  });

  // ═══════════ EXPORT / IMPORT (file) ═══════════
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(collectData(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chessium-console-backup.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('exported');
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!confirm('Import? Current data will be replaced.')) return;
        if (Array.isArray(data)) { bookmarks = data; save(DATA_KEY, bookmarks); renderWsTabs(); renderGrid(); }
        else applyImportedData(data, true);
        showToast('imported', 'success');
      } catch { showToast('invalid file', 'error'); }
    };
    r.readAsText(file);
    e.target.value = '';
  });

  // ═══════════ IDLE DIM ═══════════
  function setupIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    mainEl.classList.remove('idle');
    if (!settings.widgets.idleDim) return;
    function reset() {
      mainEl.classList.remove('idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => mainEl.classList.add('idle'), 60000);
    }
    ['mousemove', 'keydown', 'mousedown', 'scroll', 'touchstart'].forEach(ev => {
      document.addEventListener(ev, reset, { passive: true });
    });
    reset();
  }

  // ═══════════ HOTKEYS ═══════════
  document.addEventListener('keydown', (e) => {
    // Ctrl+Space → command palette
    if ((e.ctrlKey || e.metaKey) && e.code === 'Space') {
      e.preventDefault();
      openCmdk();
      return;
    }
    // Ctrl+N → add bookmark
    if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyN')) {
      e.preventDefault();
      openAddModal('bookmark');
      return;
    }
    // Ctrl+/ → toggle AI bar
    if ((e.ctrlKey || e.metaKey) && e.key === '/') {
      e.preventDefault();
      if (settings.widgets.aibar) aibar.classList.toggle('hidden');
      return;
    }
    // Alt+1..9 → quick launch
    if (e.altKey && !e.ctrlKey && !e.metaKey && /^Digit[1-9]$/.test(e.code)) {
      if (!settings.quickLaunch) return;
      const n = parseInt(e.code.slice(5));
      const items = getVisibleBookmarks().filter(b => !b.type && !b.tool && b.url);
      const target = items[n - 1];
      if (target) { e.preventDefault(); window.open(target.url, '_blank', 'noopener'); }
      return;
    }
    // Escape → close topmost
    if (e.key === 'Escape') {
      if (ctxMenu.classList.contains('active')) closeCtxMenu();
      else if (modalBackdrop.classList.contains('active')) closeModal();
      else if (settingsBackdrop.classList.contains('active')) closeSettings();
      else if (notesBackdrop.classList.contains('active')) closeNotes();
      else if (passBackdrop.classList.contains('active')) closePassgen();
      else if (phoneBackdrop.classList.contains('active')) closePhone();
      else if (cmdk.classList.contains('active')) closeCmdk();
      else if (todoPanel.classList.contains('open')) todoPanel.classList.remove('open');
    }
  });

  // ═══════════ INIT ═══════════
  buildIconGrid();
  buildColorPalette();
  applyTheme();
  applyBg();
  loadBgImage();
  renderWsTabs();
  renderGrid();
  renderTodos();
  renderSearchBar();
  applyWidgetVisibility();
  updateDeadlineBadge();
  updateSyncUi();
  setupIdle();
  setInterval(updateClock, 1000);
  updateClock();
  fetchIp();
  fetchWeather();
  fetchRates(false);

  // auto-pull if enabled
  if (settings.sync && settings.sync.autoPull && settings.sync.token && settings.sync.gistId) {
    setTimeout(() => { syncPull(); }, 800);
  }

  // ═══════════ PWA ═══════════
  // Offline support was removed — the service worker caused ERR_FAILED crashes.
  // This kill-switch unregisters any service worker still installed from an
  // older version and clears its caches, so stale clients self-heal on load.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    }).catch(() => {});
    if (window.caches && caches.keys) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
    }
  }
  // The app is still installable via the manifest (standalone window, home-screen
  // icon) — it just won't work offline.
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    updateInstallButton();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    updateInstallButton();
    showToast('app installed');
  });
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;
  }
  function updateInstallButton() {
    const btn = $('pwaInstallBtn');
    if (!btn) return;
    if (isStandalone()) {
      btn.textContent = 'installed';
      btn.disabled = true;
    } else if (deferredInstallPrompt) {
      btn.textContent = 'install app';
      btn.disabled = false;
    } else {
      btn.textContent = 'install unavailable';
      btn.disabled = true;
    }
  }
  async function triggerInstall() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    try { await deferredInstallPrompt.userChoice; } catch {}
    deferredInstallPrompt = null;
    updateInstallButton();
  }
})();

</script>
</body>
</html>
